name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.5.app

      - name: Build
        run: |
          xcodebuild archive \
            -project Ping.xcodeproj \
            -scheme Ping \
            -configuration Release \
            -archivePath build/Ping.xcarchive \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_ALLOWED=NO

      - name: Package
        run: |
          cp -R build/Ping.xcarchive/Products/Applications/Ping.app build/Ping.app
          cd build && zip -r Ping.zip Ping.app

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: build/Ping.zip
          generate_release_notes: true
